# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Gruha Alankara — Docker Compose
# Services: app, celery-worker, celery-beat, redis, chromadb
# MongoDB Atlas is used externally (cloud)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

version: "3.9"

services:
  # ── Flask Application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gruha-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - upload_data:/app/data/uploads
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      # chromadb: # Optional - only if using local ChromaDB instead of cloud
      #   condition: service_started
    restart: unless-stopped
    networks:
      - gruha-network

  # ── Celery Worker ──
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gruha-celery-worker
    command: >
      celery -A app.tasks.celery_app:celery worker
      --loglevel=info
      --concurrency=4
      --pool=prefork
      -Q default,vision,voice,web_scraping
    env_file:
      - .env
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gruha-network

  # ── Celery Beat Scheduler ──
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gruha-celery-beat
    command: >
      celery -A app.tasks.celery_app:celery beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gruha-network

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: gruha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gruha-network

  # ── ChromaDB (Optional - only needed if not using cloud) ──
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: gruha-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - gruha-network

volumes:
  redis_data:
    driver: local
  chroma_data:
    driver: local
  upload_data:
    driver: local

networks:
  gruha-network:
    driver: bridge
